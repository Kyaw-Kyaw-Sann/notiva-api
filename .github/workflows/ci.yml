name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: notiva_ci
          POSTGRES_USER: notiva
          POSTGRES_PASSWORD: notiva_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notiva -d notiva_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: ci
      DATABASE_URL: jdbc:postgresql://localhost:5432/notiva_ci
      DATABASE_USERNAME: notiva
      DATABASE_PASSWORD: notiva_ci_password
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and test
        run: ./mvnw clean verify --batch-mode
