# Application
spring.application.name=notiva-api

# Load local development secrets when present. Environment variables still take
# precedence, and .env remains excluded from version control.
spring.config.import=optional:file:.env[.properties]

# Server
server.port=8080

# Frontend
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Application URLs
app.backend-url=${BACKEND_URL:http://localhost:8080}

# # PostgreSQL datasource
# spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notiva_db}
# spring.datasource.username=${DB_USERNAME:postgres}
# spring.datasource.password=${DB_PASSWORD}

# # Hibernate
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.open-in-view=false

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# SQL logging
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_ACCESS_EXPIRATION_MILLIS:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MILLIS:2592000000}


# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email sender
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}

# Authentication
app.auth.email-verification-expiration-hours=24

# Password reset OTP
app.auth.password-reset-otp-expiration-minutes=10

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# OAuth frontend callback
app.oauth2.frontend-callback-url=${OAUTH2_FRONTEND_CALLBACK_URL:http://localhost:3000/oauth2/callback}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# Image limits
app.image.avatar-max-size=5242880
app.image.note-max-size=10485760

# Multipart uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Groq AI
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.base-url=https://api.groq.com/openai/v1
app.ai.groq.model=${GROQ_MODEL:groq/compound-mini}
app.ai.groq.connect-timeout-seconds=10
app.ai.groq.read-timeout-seconds=60
app.ai.groq.max-tokens=1024
app.ai.groq.temperature=0.7


# Notiva AI usage limits
app.ai.usage.normal-daily-limit=10
app.ai.usage.premium-daily-limit=100
app.ai.usage.time-zone=Asia/Yangon


# Voyage Embeddings
app.ai.embedding.api-key=${VOYAGE_API_KEY:}
app.ai.embedding.base-url=https://api.voyageai.com/v1
app.ai.embedding.model=${VOYAGE_MODEL:voyage-4-lite}
app.ai.embedding.dimension=512
app.ai.embedding.connect-timeout-seconds=10
app.ai.embedding.read-timeout-seconds=60
