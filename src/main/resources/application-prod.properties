# Activate with SPRING_PROFILES_ACTIVE=prod after Phase 2 has established the
# Flyway baseline. Production schema changes must be migrations, not Hibernate updates.
spring.config.activate.on-profile=prod

# Managed platforms inject PORT and must be able to identify the original HTTPS request.
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Fail startup if the deployed schema does not match the application mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Fresh databases apply V1 automatically. For a non-empty existing database,
# set FLYWAY_BASELINE_ON_MIGRATE=true for the one baseline deployment only,
# after a verified backup; remove it again after flyway_schema_history exists.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# Keep production logs useful without emitting SQL or debug request details.
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN

# API errors are produced by GlobalExceptionHandler; never expose framework details.
server.error.include-message=never
server.error.include-stacktrace=never
