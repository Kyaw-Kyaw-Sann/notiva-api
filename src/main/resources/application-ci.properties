# Isolated CI database configuration. GitHub Actions supplies a temporary
# pgvector PostgreSQL service; no personal database or production secret is used.
spring.config.activate.on-profile=ci

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

app.frontend-url=http://localhost:3000
app.backend-url=http://localhost:8080
app.jwt.secret=${JWT_SECRET}
spring.mail.username=ci@example.com
spring.mail.password=not-used-in-tests
app.mail.from=ci@example.com
spring.security.oauth2.client.registration.google.client-id=ci-client-id
spring.security.oauth2.client.registration.google.client-secret=ci-client-secret
app.oauth2.frontend-callback-url=http://localhost:3000/oauth2/callback
cloudinary.cloud-name=ci-cloud
cloudinary.api-key=ci-key
cloudinary.api-secret=ci-secret
